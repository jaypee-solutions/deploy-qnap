---
# Immich version — check https://github.com/immich-app/immich/releases for latest
# Also update immich_db_image when upgrading major versions
immich_version: "v3.3.1"

# Postgres image — verify against official docker-compose.yml for your Immich version:
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
immich_db_image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"
immich_valkey_image: "docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d"

# Paths (can be overridden via group_vars)
immich_stack_dir:   /share/Container/immich
immich_upload_dir:  /share/Immich
immich_backup_dir:  /share/Container/immich/backups

# Database credentials
immich_db_username: immich
immich_db_password: "{{ vault_db_password }}"
immich_db_name:     immich

# Network
immich_port: 2283

# Backup retention in days
immich_backup_keep_days: 7

# Docker binary — Container Station 3.x on QNAP
immich_docker_bin: /share/CACHEDEV1_DATA/.qpkg/container-station/bin/docker
