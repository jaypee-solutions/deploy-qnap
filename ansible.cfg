[defaults]
inventory           = inventory/hosts.ini
remote_tmp          = /tmp/.ansible/tmp
stdout_callback     = ansible.builtin.default
result_format       = yaml
# vault password is provided via ANSIBLE_VAULT_PASSWORD_FILE (set by direnv/.envrc)

# macOS: brew install hudochenkov/sshpass/sshpass
[ssh_connection]
pipelining = True
# RequestTTY=no prevents QNAP's interactive management CLI from launching
# `%(here)s` is not expanded inside ssh_args and is rejected by recent OpenSSH.
# Use the standard user known_hosts file instead.
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o RequestTTY=no
