[defaults]
inventory           = inventory/hosts.ini
remote_tmp          = /tmp/.ansible/tmp
stdout_callback     = ansible.builtin.default
result_format       = yaml
# vault password is provided via ANSIBLE_VAULT_PASSWORD_FILE (set by direnv/.envrc)

# macOS: brew install hudochenkov/sshpass/sshpass
[ssh_connection]
pipelining = True
# RequestTTY=no prevents QNAP's interactive management CLI from launching
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o RequestTTY=no
